apiVersion: v1
kind: ConfigMap
metadata:
  name: ingestor-config
  namespace: marketdata
data:
  RUST_LOG: info
  INGESTOR__WS_ENDPOINT: wss://api.coin.z.com/ws/public/v1
  INGESTOR__SYMBOLS: BTC_JPY,ETH_JPY
  INGESTOR__CHANNELS: ticker,trades,orderbooks
  INGESTOR__KAFKA__BROKERS: redpanda.marketdata.svc.cluster.local:9092
  INGESTOR__ADMIN__BIND_ADDR: 0.0.0.0:9090

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gmo-ingestor
  namespace: marketdata
  labels:
    app: gmo-ingestor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gmo-ingestor
  template:
    metadata:
      labels:
        app: gmo-ingestor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: ingestor
          image: ghcr.io/Shion1305/gmocoin-data-lab/ingestor:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ingestor-config
            - secretRef:
                name: ingestor-secrets
          ports:
            - name: admin
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /live
              port: admin
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
          terminationMessagePolicy: FallbackToLogsOnError
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: gmo-ingestor-admin
  namespace: marketdata
  labels:
    app: gmo-ingestor
spec:
  selector:
    app: gmo-ingestor
  ports:
    - name: http
      port: 9090
      targetPort: admin

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gmo-ingestor-pdb
  namespace: marketdata
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gmo-ingestor

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gmo-ingestor-hpa
  namespace: marketdata
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gmo-ingestor
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
