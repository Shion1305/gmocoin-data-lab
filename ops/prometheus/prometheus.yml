global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: gmo-ingestor
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9090"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: ingestor-local

  - job_name: gmo-backtester
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8081"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: backtester-local
