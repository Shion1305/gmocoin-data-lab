services:
  redpanda:
    image: redpandadata/redpanda:v23.3.5
    container_name: redpanda
    command:
      [
        "redpanda",
        "start",
        "--overprovisioned",
        "--smp=1",
        "--memory=1G",
        "--reserve-memory=0M",
        "--node-id=0",
        "--check=false",
        "--kafka-addr",
        "PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092",
        "--advertise-kafka-addr",
        "PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092"
      ]
    ports:
      - "19092:19092"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--api-urls", "localhost:9644"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - redpanda
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:9092
    ports:
      - "8085:8080"

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse
    environment:
      CLICKHOUSE_DB: gmo
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./ops/clickhouse/ddl:/docker-entrypoint-initdb.d:ro

  prometheus:
    image: prom/prometheus:v2.48.0
    depends_on:
      - redpanda
      - clickhouse
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:10.4.19
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_BASIC_ENABLED: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro

  schema-init:
    image: curlimages/curl:8.4.0
    depends_on:
      - clickhouse
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "sleep 5 && \
       for file in /ddl/*.sql; do \
         if [ \"$$file\" = \"/ddl/kafka_sources.sql\" ]; then \
           echo Skipping optional kafka_sources.sql; \
           continue; \
         fi; \
         echo Running $$file; \
         curl -sS --retry 5 --retry-delay 2 --request POST clickhouse:8123 --data-binary @$$file; \
       done"
    volumes:
      - ./ops/clickhouse/ddl:/ddl:ro
    profiles:
      - bootstrap
