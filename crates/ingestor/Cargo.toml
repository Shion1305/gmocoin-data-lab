axum = { workspace = true }
backoff = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
gmocoin-common = { path = "../common" }
gmocoin-proto = { path = "../../proto" }
http = { workspace = true }
once_cell = { workspace = true }
