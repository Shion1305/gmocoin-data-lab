name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      zookeeper:
        image: bitnami/zookeeper:3.9
        ports:
          - 2181:2181
        options: >-
          --health-cmd="echo ruok | nc -w 2 localhost 2181 | grep imok"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      kafka:
        image: bitnami/kafka:3.7
        ports:
          - 9092:9092
        env:
          KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
          KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
        options: >-
          --health-cmd="kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      clickhouse:
        image: clickhouse/clickhouse-server:23.8
        ports:
          - 8123:8123
      clickhouse-init:
        image: curlimages/curl:8.18.0
        needs: clickhouse
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Wait for ClickHouse
        run: |
          until curl -sSf http://localhost:8123; do sleep 2; done
      - name: Apply ClickHouse schema
        run: |
          for file in ops/clickhouse/ddl/*.sql; do
            curl -sS --request POST --data-binary @"$file" http://localhost:8123
          done
      - name: Run tests
        env:
          RUST_LOG: info
        run: cargo test --workspace --all-targets -- --nocapture

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ingestor image
        run: docker build -f docker/ingestor.Dockerfile -t gmocoin-ingestor:ci .
      - name: Build backtester image
        run: docker build -f docker/backtester.Dockerfile -t gmocoin-backtester:ci .
